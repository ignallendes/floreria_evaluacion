<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets\img\logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playwrite+DE+SAS:wght@100..400&family=Playwrite+NZ+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets\css\styles.css">
    <title>Dale tu Sentido</title>
</head>

<body>
    <header>
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-10 mt-4">
                    <nav class="nav custom-nav">
                        <ul class="d-flex list-unstyled align-items-center gap-3 m-0 p-2">
                            <li class="cursivo">Dale tu Sentido</li>
                            <li>Inicio</li>
                            <li>Insumos</li>
                            <li>Arreglos</li>
                            <li>Peluches</li>
                        </ul>
                    </nav>
                </div>

            </div>
        </div>
        <main>
            <div class="container">
                <div class="row justify-content-center">

                    <div class="col-10 mt-5">
                        <div class="row align-items-center">

                            <div class="col-4">
                                <h1 class="display-4 fw-bold">Descubre nuestro catalogo</h1>
                            </div>

                            <div class="col-8">
                                <div id="carouselExampleCaptions" class="carousel slide w-100" data-bs-ride="carousel">

                                    <!-- Indicadores -->
                                    <div class="carousel-indicators">
                                        <button type="button" data-bs-target="#carouselExampleCaptions"
                                            data-bs-slide-to="0" class="active" aria-current="true"
                                            aria-label="Slide 1"></button>

                                        <button type="button" data-bs-target="#carouselExampleCaptions"
                                            data-bs-slide-to="1" aria-label="Slide 2"></button>

                                        <button type="button" data-bs-target="#carouselExampleCaptions"
                                            data-bs-slide-to="2" aria-label="Slide 3"></button>
                                    </div>

                                    <!-- Slides -->
                                    <div class="carousel-inner">

                                        <div class="carousel-item active">
                                            <img src="assets/img/img-banner-1.jpg" class="d-block w-100" alt="Banner 1">

                                            <div class="carousel-caption d-none d-md-block">
                                                <h5>Flores naturales</h5>
                                                <p>Descubre nuestros arreglos florales.</p>
                                            </div>
                                        </div>

                                        <div class="carousel-item">
                                            <img src="assets/img/img-banner-2.jpg" class="d-block w-100" alt="Banner 2">

                                            <div class="carousel-caption d-none d-md-block">
                                                <h5>Regalos especiales</h5>
                                                <p>Perfectos para cualquier ocasión.</p>
                                            </div>
                                        </div>

                                        <div class="carousel-item">
                                            <img src="assets/img/img-banner-3.jpg" class="d-block w-100" alt="Banner 3">

                                            <div class="carousel-caption d-none d-md-block">
                                                <h5>Catálogo exclusivo</h5>
                                                <p>Encuentra el detalle ideal.</p>
                                            </div>
                                        </div>

                                    </div>

                                    <!-- Botón anterior -->
                                    <button class="carousel-control-prev" type="button"
                                        data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">

                                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Previous</span>
                                    </button>

                                    <!-- Botón siguiente -->
                                    <button class="carousel-control-next" type="button"
                                        data-bs-target="#carouselExampleCaptions" data-bs-slide="next">

                                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Next</span>
                                    </button>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
            <div class="container text-center">
                <div class="row">
                    <div class="col">
                        Column
                    </div>
                    <div class="col">
                        Column
                    </div>
                    <div class="col">
                        Column
                    </div>
                </div>
            </div>
        </main>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
